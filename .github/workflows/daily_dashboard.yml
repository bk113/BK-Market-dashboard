name: Daily Market Dashboard

on:
  schedule:
    # Primary: 22:17 UTC Mon-Fri, after the US close in both EDT (20:00 UTC)
    # and EST (21:00 UTC).
    - cron: '17 22 * * 1-5'
    # Safety: 22:47 UTC Mon-Fri. Exits early (--skip-if-fresh) when the primary
    # run already published the latest completed NYSE session.
    - cron: '47 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

# One run at a time: a later run waits, then checks out what the earlier one pushed.
concurrency:
  group: daily-dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas numpy matplotlib pytz schedule python-pptx anthropic hmmlearn scikit-learn scipy requests pandas_market_calendars

      - name: Refresh FRED series
        timeout-minutes: 10
        continue-on-error: true
        run: python tools/refresh_fred_manual.py

      - name: Run dashboard
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        timeout-minutes: 30
        # Scheduled runs skip when market_pulse.json is already fresh; manual runs always rebuild.
        run: python bk_market_dashboard.py --html --lookback 2520 ${{ github.event_name == 'schedule' && '--skip-if-fresh' || '' }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html data/prices_cache.csv data/volumes_cache.csv || true
          git add docs/data/market_pulse.json || true
          git add data/panel_v22_prices.csv data/panel_v22_returns.csv data/panel_v22_volumes.csv data/panel_v22_levels.csv data/panel_v22_metadata.csv || true
          git add data/fred_staleness_report.csv data/winsorization_report.csv || true
          git add tools/fragility_migration/fred_manual/*.csv || true
          git add data/clip_log.csv || true
          git diff --staged --quiet || git commit -m "chore: daily update $(date -u +'%Y-%m-%d %H:%M UTC')"
          echo "--- git status after commit ---"
          git status --porcelain
          git pull --rebase origin main
          git push
